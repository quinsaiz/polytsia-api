[loggers]
keys = root,src

[handlers]
keys = console

[formatters]
keys = standard

[logger_root]
level = WARNING
handlers = console

[logger_src]
level = DEBUG
handlers = console
qualname = src
propagate = 0

[handler_console]
class = StreamHandler
level = DEBUG
formatter = standard
args = (sys.stdout,)

[formatter_standard]
format = %(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s
datefmt = %Y-%m-%d %H:%M:%S
