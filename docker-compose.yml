services:
  backend:
    build: .
    command: backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      RELOAD: "true"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build: .
    command: celery_worker
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery_beat:
    build: .
    command: celery_beat
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  recommendations_bootstrap:
    build: .
    command: bootstrap_recommendations
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  redis_data:
