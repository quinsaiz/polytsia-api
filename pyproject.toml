[project]
name = "polytsia-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.138.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.49.0",
    "wait-for-it>=2.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.19",
    "sqlalchemy[mypy]>=2.0.51",
    "types-python-jose>=3.5.0.20260408",
]

# ---- Ruff ----
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (TYPE_CHECKING blocks)
    "ASYNC", # flake8-async
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
]
unfixable = [
    "F401", # unused imports
]

[tool.ruff.lint.per-file-ignores]
"src/database.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---- Mypy ----
[tool.mypy]
python_version = "3.13"
strict = true
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]

[[tool.mypy.overrides]]
module = "src.config"
disable_error_code = ["prop-decorator"]

# ---- Pytest ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
